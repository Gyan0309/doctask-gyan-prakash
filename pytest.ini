[pytest]
testpaths = tests
addopts = -q --strict-markers
# The MCP tests drive a real client over the protocol, which is async. `auto` rather
# than decorating every one of them: an undecorated async test does not fail, it is
# silently skipped as "returning a coroutine", and a suite that skips its machine
# interface while reporting green is the failure this project has already been bitten
# by once.
asyncio_mode = auto
markers =
    integration: needs a live Postgres (provided by docker compose or CI services)
    slow: takes more than a few seconds — kill/resume and concurrency tests
