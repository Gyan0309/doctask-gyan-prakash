# Packages live flat at the repository root and are imported directly — there is no
# build step and nothing to pip-install. Pytest configuration lives in pytest.ini.
# This file carries lint configuration only.

[tool.ruff]
line-length = 100
src = ["."]
exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
